<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Terima Kasih</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.box {
  background: #1e293b;
  padding: 30px;
  border-radius: 12px;
  text-align: center;
  animation: fadeUp 0.6s ease;
}

h1 {
  font-size: 24px;
}

p {
  color: #94a3b8;
}

a {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 15px;
  background: #22c55e;
  color: white;
  text-decoration: none;
  border-radius: 8px;
}

a:hover {
  background: #16a34a;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>
</head>

<body>

<div class="box">
  <h1>✅ Terima Kasih!</h1>
  <p>Data kamu sudah masuk 🔥</p>

  <a href="index.html">Isi Lagi</a>
</div>

</body>
</html>
