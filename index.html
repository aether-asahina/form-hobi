<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Hobi</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 40px 10px;
}

.container {
  max-width: 500px;
  margin: auto;
}

/* progress bar */
.progress {
  height: 6px;
  background: #334155;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 15px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #22c55e, #4ade80);
  transition: 0.4s;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);

  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.5s ease forwards;
}

.card:hover {
  transform: translateY(-4px);
  transition: .3s;
}

@keyframes fadeUp {
  to { opacity:1; transform:translateY(0); }
}

label {
  display:block;
  margin-bottom:8px;
}

input[type="text"], textarea, select {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#334155;
  color:white;
  margin-top:5px;
}

input:focus, textarea:focus, select:focus {
  outline:none;
  box-shadow:0 0 0 2px #22c55e;
}

/* checkbox modern */
.option {
  display:inline-block;
  padding:8px 12px;
  border-radius:20px;
  background:#334155;
  margin:5px 5px 0 0;
  cursor:pointer;
  transition:0.2s;
}

.option input {
  display:none;
}

.option.active {
  background:#22c55e;
}

button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:linear-gradient(135deg, #22c55e, #16a34a);
  color:white;
  cursor:pointer;
  transition:.2s;
}

button:active {
  transform:scale(.97);
}

.hidden {
  display:none;
}

.status {
  text-align:center;
  margin-top:10px;
  color:#4ade80;
}

/* spinner */
.spinner {
  width:30px;
  height:30px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:10px auto;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

#loading {
  text-align:center;
  margin-top:10px;
}

/* header */
.header {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

.header::before {
  content: "";
  position: absolute;
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  top: -50px;
  right: -50px;
}

#secretRocket {
  cursor: default;
}
  .header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.header-text {
  flex: 1;
}

.header-img {
  width: 80px;
  opacity: 0.9;
  animation: float 3s ease-in-out infinite;
}

.sub {
  font-size: 13px;
  opacity: 0.8;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0px); }
}

/* biar mobile tetap enak */
@media (max-width: 500px) {
  .header-content {
    flex-direction: column;
    text-align: center;
  }

  .header-img {
    width: 60px;
  }
}
  .hobi-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.chip {
  position: relative;
  cursor: pointer;
}

.chip input {
  display: none;
}

.chip span {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 20px;
  background: #334155;
  transition: 0.2s;
}

/* KALO KEKLIK */
.chip input:checked + span {
  background: #22c55e;
  color: white;
  transform: scale(1.05);
}
  #lainnyaInput:focus {
  box-shadow: 0 0 0 2px #22c55e;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="header-content">
    
    <div class="header-text">
      <h1>
        <span id="secretRocket">🚀</span> Kenali Potensi Dirimu
      </h1>

      <p>
        Data ini bakal bantu kami bikin event, komunitas, dan peluang 
        yang sesuai sama minat kalian.
      </p>

      <p class="sub">
        Isi dengan jujur ya — siapa tau dari hobi bisa jadi peluang penghasilan
      </p>
    </div>

    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="header-img">

  </div>
</div>

<!-- progress -->
<div class="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<form id="formHobi">

<div class="card">
<label>Nama</label>
<input id="nama" type="text" required>
</div>

<div class="card">
<label>Semester</label>
<label><input type="radio" name="semester" value="2"> 2</label>
<label><input type="radio" name="semester" value="4"> 4</label>
<label><input type="radio" name="semester" value="6"> 6</label>
<label><input type="radio" name="semester" value="8"> 8</label>
</div>

<div class="card">
  <label>Hobi</label>

  <div class="hobi-list">
    <label class="chip">
      <input type="checkbox" name="hobi" value="Gaming">
      <span>Gaming</span>
    </label>

    <label class="chip">
      <input type="checkbox" name="hobi" value="Olahraga">
      <span>Olahraga</span>
    </label>

    <label class="chip">
      <input type="checkbox" name="hobi" value="Ngoding">
      <span>Ngoding</span>
    </label>

    <label class="chip">
      <input type="checkbox" name="hobi" value="Musik">
      <span>Musik</span>
    </label>

    <label class="chip">
      <input type="checkbox" name="hobi" value="Bisnis/Trading">
      <span>Trading</span>
    </label>

    <label class="chip">
      <input type="checkbox" name="hobi" value="Date with Ayang">
      <span>Date with Ayang</span>
    </label>
  </div>

  <label class="chip">
  <input type="checkbox" id="lainnyaCheck">
  <span>Lainnya</span>
</label>

<input id="lainnyaInput" type="text" placeholder="Isi hobi lain..." class="hidden">
</div>
<div class="card">
<label>Minat ke depan</label>
<select id="minat" required>
<option value="">Pilih</option>
<option value="Cuma hobi">Cuma hobi</option>
<option value="Mau dikembangkan">Mau dikembangkan</option>
<option value="Mau jadi penghasilan">Mau jadi penghasilan</option>
</select>
</div>

<div class="card">
  <label>Tujuan (apa yang mau di capai dari hobi ini?)</label>
<textarea id="tujuan" placeholder="Contoh: Mau jadi freelancer, ikut lomba, atau jadi penghasilan..."></textarea>
</div>

<div class="card">
<button id="submitBtn">Kirim</button>

<div id="loading" class="hidden">
<div class="spinner"></div>
<p>Ngirim data...</p>
</div>

<p id="status" class="status"></p>
</div>

</form>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfw2aw4kZkFgBnzRs4aBpDOomrNnD5JcM",
  authDomain: "hobi-c4dca.firebaseapp.com",
  projectId: "hobi-c4dca",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("formHobi");
const status = document.getElementById("status");
const loading = document.getElementById("loading");
const button = document.getElementById("submitBtn");

const lainnyaCheck = document.getElementById("lainnyaCheck");
const lainnyaInput = document.getElementById("lainnyaInput");

// toggle lainnya
lainnyaCheck.addEventListener("change", () => {
  const isChecked = lainnyaCheck.checked;

  lainnyaInput.classList.toggle("hidden", !isChecked);

  if (isChecked) {
    lainnyaInput.focus(); // auto fokus
  } else {
    lainnyaInput.value = ""; // reset kalau dimatiin
  }
});

// BONUS: kalau user mulai ngetik → auto centang
lainnyaInput.addEventListener("input", () => {
  if (lainnyaInput.value.trim() !== "") {
    lainnyaCheck.checked = true;
    lainnyaInput.classList.remove("hidden");
  }
});

// checkbox UI
document.querySelectorAll(".option").forEach(el => {
  el.addEventListener("click", () => {
    el.classList.toggle("active");
  });
});

// progress bar
const inputs = document.querySelectorAll("input, textarea, select");

function updateProgress() {
  let filled = 0;

  inputs.forEach(i => {
    if ((i.type === "checkbox" || i.type === "radio")) {
      if (i.checked) filled++;
    } else if (i.value) {
      filled++;
    }
  });

  const percent = (filled / inputs.length) * 100;
  document.getElementById("progressBar").style.width = percent + "%";
}

inputs.forEach(i => i.addEventListener("change", updateProgress));

// submit
form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const semester = document.querySelector('input[name="semester"]:checked')?.value;
  if (!semester) return alert("Pilih semester");

  let hobi = Array.from(document.querySelectorAll('input[name="hobi"]:checked'))
    .map(el => el.value);

  if (lainnyaCheck.checked && lainnyaInput.value.trim() !== "") {
    hobi.push(lainnyaInput.value);
  }

  if (hobi.length === 0) return alert("Pilih hobi");

  loading.classList.remove("hidden");
  button.disabled = true;
  button.innerText = "Loading...";

  await addDoc(collection(db, "hobi"), {
    nama: document.getElementById("nama").value,
    semester,
    hobi,
    minat: document.getElementById("minat").value,
    tujuan: document.getElementById("tujuan").value,
    waktu: new Date()
  });

  loading.classList.add("hidden");
  button.disabled = false;
  button.innerText = "Kirim";

  status.innerText = "Terkirim 🚀";

  setTimeout(() => {
    window.location.href = "thanks.html";
  }, 1500);

  form.reset();
});

// secret admin
window.addEventListener("DOMContentLoaded", () => {
  let clickCount = 0;
  const rocket = document.getElementById("secretRocket");

  rocket.addEventListener("click", () => {
    clickCount++;
    if (clickCount >= 5) {
      window.location.href = "admin-7x92-hidden.html";
    }
    setTimeout(() => clickCount = 0, 2000);
  });
});
</script>

</body>
</html>
