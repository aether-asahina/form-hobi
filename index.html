<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Hobi</title>

<style>
body {
  background: #0f172a;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 40px 10px;
}

.container {
  max-width: 500px;
  margin: auto;
}

.card {
  background: #1e293b;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 0 10px rgba(0,0,0,0.3);

  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.5s ease forwards;
}

.card:nth-child(1){animation-delay:.1s}
.card:nth-child(2){animation-delay:.2s}
.card:nth-child(3){animation-delay:.3s}
.card:nth-child(4){animation-delay:.4s}
.card:nth-child(5){animation-delay:.5s}
.card:nth-child(6){animation-delay:.6s}

@keyframes fadeUp {
  to { opacity:1; transform:translateY(0); }
}

.card:hover {
  transform: translateY(-3px);
  transition: .3s;
}

label {
  display:block;
  margin-bottom:8px;
}

input[type="text"], textarea, select {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#334155;
  color:white;
  margin-top:5px;
}

input:focus, textarea:focus, select:focus {
  outline:none;
  box-shadow:0 0 0 2px #22c55e;
}

input[type="radio"], input[type="checkbox"] {
  margin-right:6px;
}

button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:white;
  cursor:pointer;
  transition:.2s;
}

button:hover {
  background:#16a34a;
}

button:active {
  transform:scale(.97);
}

button:disabled {
  opacity:0.6;
  cursor:not-allowed;
}

.hidden {
  display:none;
}

.status {
  text-align:center;
  margin-top:10px;
  color:#4ade80;
}

/* spinner */
.spinner {
  width:30px;
  height:30px;
  border:4px solid #334155;
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:10px auto;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

#loading {
  text-align:center;
  margin-top:10px;
}

  .header {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
}

/* glow effect */
.header::before {
  content: "";
  position: absolute;
  width: 200px;
  height: 200px;
  background: rgba(255,255,255,0.1);
  border-radius: 50%;
  top: -50px;
  right: -50px;
}

/* text */
.header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: bold;
}

.header p {
  margin-top: 10px;
  font-size: 14px;
  color: rgba(255,255,255,0.9);
}
  .header {
  animation: fadeUp 0.6s ease;
  }
</style>
</head>

<body>

<div class="container">
      <div class="header">
  <h1>🚀 Kenali Potensi Dirimu</h1>
  <p>
    Isi form ini buat lihat arah minat & peluang lo ke depan.<br>
    Siapa tau dari hobi bisa jadi cuan 😏
  </p>
      </div>

  <form id="formHobi">

    <div class="card">
      <label>Nama</label>
      <input id="nama" type="text" required>
    </div>

    <div class="card">
      <label>Semester</label>
      <label><input type="radio" name="semester" value="2"> 2</label>
      <label><input type="radio" name="semester" value="4"> 4</label>
      <label><input type="radio" name="semester" value="6"> 6</label>
      <label><input type="radio" name="semester" value="8"> 8</label>
    </div>

    <div class="card">
      <label>Hobi</label>

      <label><input type="checkbox" name="hobi" value="Gaming"> Gaming</label>
      <label><input type="checkbox" name="hobi" value="Olahraga"> Olahraga</label>
      <label><input type="checkbox" name="hobi" value="Ngoding"> Ngoding</label>
      <label><input type="checkbox" name="hobi" value="Musik"> Musik</label>
      <label><input type="checkbox" name="hobi" value="Bisnis/Trading"> Bisnis/Trading</label>
      <label><input type="checkbox" name="hobi" value="Date with Ayang"> Date with Ayang</label>

      <label><input type="checkbox" id="lainnyaCheck"> Lainnya</label>
      <input id="lainnyaInput" type="text" placeholder="Isi hobi lain..." class="hidden">
    </div>

    <div class="card">
      <label>Minat ke depan</label>
      <select id="minat" required>
        <option value="">Pilih</option>
        <option value="Cuma hobi">Cuma hobi</option>
        <option value="Mau dikembangkan">Mau dikembangkan</option>
        <option value="Mau jadi penghasilan">Mau jadi penghasilan</option>
      </select>
    </div>

    <div class="card">
      <label>Tujuan</label>
      <textarea id="tujuan"></textarea>
    </div>

    <div class="card">
      <button id="submitBtn">Kirim</button>

      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p>Ngirim data...</p>
      </div>

      <p id="status" class="status"></p>
    </div>

  </form>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfw2aw4kZkFgBnzRs4aBpDOomrNnD5JcM",
  authDomain: "hobi-c4dca.firebaseapp.com",
  projectId: "hobi-c4dca",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("formHobi");
const status = document.getElementById("status");
const loading = document.getElementById("loading");
const button = document.getElementById("submitBtn");

const lainnyaCheck = document.getElementById("lainnyaCheck");
const lainnyaInput = document.getElementById("lainnyaInput");

lainnyaCheck.addEventListener("change", () => {
  lainnyaInput.classList.toggle("hidden", !lainnyaCheck.checked);
});

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const semester = document.querySelector('input[name="semester"]:checked')?.value;
  if (!semester) return alert("Pilih semester ");

  let hobi = Array.from(document.querySelectorAll('input[name="hobi"]:checked'))
    .map(el => el.value);

  if (lainnyaCheck.checked && lainnyaInput.value.trim() !== "") {
    hobi.push(lainnyaInput.value);
  }

  if (hobi.length === 0) return alert("Pilih hobi ");

  loading.classList.remove("hidden");
  button.disabled = true;
  button.innerText = "Loading...";

  await addDoc(collection(db, "hobi"), {
    nama: document.getElementById("nama").value,
    semester,
    hobi,
    minat: document.getElementById("minat").value,
    tujuan: document.getElementById("tujuan").value,
    waktu: new Date()
  });

  loading.classList.add("hidden");
  button.disabled = false;
  button.innerText = "Kirim";

  status.innerText = "Terkirim 🚀";
  status.style.opacity = 0;
  setTimeout(() => status.style.opacity = 1, 100);
  
  // redirect setelah 1.5 detik
  setTimeout(() => {
  window.location.href = "thanks.html";
}, 1500);
 
  form.reset();
  lainnyaInput.classList.add("hidden");
});
</script>

</body>
</html>
