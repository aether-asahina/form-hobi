<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Hobi - Analytics Edition</title>

<link rel="icon" type="image/jpeg" href="jokowi.jpg">

<style>
/* TEMA DEEP SEA & ROYAL BLUE */
body {
  background: linear-gradient(270deg, #020617, #0f172a, #1e3a8a, #020617);
  background-size: 600% 600%;
  animation: gradientMove 25s ease infinite;
  color: white;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 20px 30px;
  min-height: 100vh;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.container {
  max-width: 480px;
  margin: auto;
}

.header {
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 15px;
  color: white;
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.header-text h1 { 
  margin: 0; 
  font-size: 18px; 
  cursor: pointer; /* Menandakan bisa diklik */
  user-select: none;
}
.header-text p { margin: 5px 0 0; opacity: 0.8; font-size: 12px; }

.header-img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  object-fit: cover;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

.progress {
  height: 4px;
  background: #1e293b;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 15px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: #3b82f6;
  transition: 0.4s;
}

.card {
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(10px);
  padding: 24px;
  border-radius: 16px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.input-group {
  margin-bottom: 20px;
}

label {
  display: block;
  margin-bottom: 8px;
  font-size: 14px;
  color: #94a3b8;
}

input[type="text"], textarea, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #334155;
  border-radius: 10px;
  background: #1e293b;
  color: white;
  box-sizing: border-box;
  font-size: 14px;
}

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: #3b82f6;
}

.hobi-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip { cursor: pointer; }
.chip input { display: none; }
.chip span {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 50px;
  background: #1e293b;
  border: 1px solid #334155;
  font-size: 13px;
  transition: 0.3s;
}

.chip input:checked + span {
  background: #3b82f6;
  border-color: #3b82f6;
  color: white;
  font-weight: bold;
}

.ide-event-box {
  background: rgba(59, 130, 246, 0.05);
  border: 1px dashed rgba(59, 130, 246, 0.4);
  padding: 15px;
  border-radius: 12px;
  margin-top: 10px;
}

.ide-event-box label {
  color: #60a5fa;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #3b82f6;
  color: white;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.hidden { display: none !important; }
.footer { text-align: center; padding: 20px; font-size: 11px; color: #475569; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-content">
      <div class="header-text">
        <h1 id="secretRocket">🚀 Kenali Potensi Dirimu</h1>
        <p>Bantu kami merancang event yang seru sesuai hobimu.</p>
      </div>
      <img src="jokowi.jpg" class="header-img" alt="Profile">
    </div>
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <form id="formHobi">
    <div class="card">
      <div class="input-group">
        <label>Nama Lengkap</label>
        <input id="nama" type="text" placeholder="Masukkan nama..." required>
      </div>

      <div class="input-group">
        <label>Semester</label>
        <select id="semester" required>
          <option value="">Pilih Semester</option>
          <option value="2">Semester 2</option>
          <option value="4">Semester 4</option>
          <option value="6">Semester 6</option>
          <option value="8">Semester 8</option>
        </select>
      </div>

      <div class="input-group">
        <label>Pilih Hobi</label>
        <div class="hobi-list">
          <label class="chip"><input type="checkbox" name="hobi" value="Gaming"><span>Gaming</span></label>
          <label class="chip"><input type="checkbox" name="hobi" value="Olahraga"><span>Olahraga</span></label>
          <label class="chip"><input type="checkbox" name="hobi" value="Ngoding"><span>Ngoding</span></label>
          <label class="chip"><input type="checkbox" name="hobi" value="Musik"><span>Musik</span></label>
          <label class="chip"><input type="checkbox" name="hobi" value="Trading"><span>Trading</span></label>
          <label class="chip"><input type="checkbox" name="hobi" value="Date with Ayang"><span>Date with Ayang</span></label>
        </div>
        <label class="chip" style="margin-top: 8px; display: inline-block;">
          <input type="checkbox" id="lainnyaCheck"><span>Lainnya</span>
        </label>
        <input id="lainnyaInput" type="text" placeholder="Sebutkan hobi lain..." class="hidden" style="margin-top:10px">
      </div>

      <div class="input-group">
        <label>Level Komitmen (Minat)</label>
        <select id="minat" required>
          <option value="">Kamu di posisi mana?</option>
          <option value="Explorer">Explorer — Baru mau coba-coba hobi ini</option>
          <option value="Specialist">Specialist — Mau asah skill lebih dalem lagi</option>
          <option value="Professional">Professional — Target jadi sumber cuan/karir</option>
        </select>
      </div>

      <div class="input-group">
        <label>Goals / Target Utama</label>
        <textarea id="tujuan" rows="4" placeholder="Contoh: Pengen punya networking baru, atau pengen jago rakit PC..."></textarea>
      </div>

      <div class="ide-event-box">
        <label>💡 Ide Event Kedepannya</label>
        <p style="font-size: 10px; color: #64748b; margin: 2px 0 8px 0;">Mau buat event apa & kek mana teknisnya?</p>
        <textarea id="ideEvent" placeholder="Contoh: Tournament MLBB, Bedah Hardware, dll..." rows="3"></textarea>
      </div>

      <div style="margin-top: 20px;">
        <button id="submitBtn" type="submit">Kirim Data</button>
        <div id="loading" class="hidden" style="text-align: center;">
          <p style="color: #3b82f6; font-size: 14px;">Memproses...</p>
        </div>
      </div>
    </div>
  </form>

  <footer class="footer">
    © 2026 Form Hobi • Hobi Analytics Pro
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfw2aw4kZkFgBnzRs4aBpDOomrNnD5JcM",
  authDomain: "hobi-c4dca.firebaseapp.com",
  projectId: "hobi-c4dca",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Logic Checkbox Lainnya
const lainnyaCheck = document.getElementById("lainnyaCheck");
const lainnyaInput = document.getElementById("lainnyaInput");
lainnyaCheck.addEventListener("change", () => {
  lainnyaInput.classList.toggle("hidden", !lainnyaCheck.checked);
});

// Progress Bar Logic
const inputs = document.querySelectorAll("input, textarea, select");
function updateProgress() {
  let filled = 0;
  if(document.getElementById("nama").value) filled++;
  if(document.getElementById("semester").value) filled++;
  if(document.querySelector('input[name="hobi"]:checked') || lainnyaCheck.checked) filled++;
  if(document.getElementById("minat").value) filled++;
  if(document.getElementById("tujuan").value) filled++;
  if(document.getElementById("ideEvent").value) filled++;

  const percent = (filled / 6) * 100;
  document.getElementById("progressBar").style.width = percent + "%";
}
inputs.forEach(i => i.addEventListener("input", updateProgress));
inputs.forEach(i => i.addEventListener("change", updateProgress));

// Submit Logic
document.getElementById("formHobi").addEventListener("submit", async (e) => {
  e.preventDefault();
  
  let hobi = Array.from(document.querySelectorAll('input[name="hobi"]:checked')).map(el => el.value);
  if (lainnyaCheck.checked && lainnyaInput.value) hobi.push(lainnyaInput.value);

  document.getElementById("submitBtn").classList.add("hidden");
  document.getElementById("loading").classList.remove("hidden");

  try {
    await addDoc(collection(db, "hobi"), {
      nama: document.getElementById("nama").value,
      semester: document.getElementById("semester").value,
      hobi,
      minat: document.getElementById("minat").value,
      tujuan: document.getElementById("tujuan").value,
      ideEvent: document.getElementById("ideEvent").value,
      waktu: new Date()
    });
    alert("Berhasil Terkirim! 🚀");
    location.reload();
  } catch (err) {
    alert("Gagal kirim.");
    document.getElementById("submitBtn").classList.remove("hidden");
    document.getElementById("loading").classList.add("hidden");
  }
});

// SECRET ROCKET LOGIC (Klik 5x)
let clickCount = 0;
const rocketTrigger = document.getElementById("secretRocket");
rocketTrigger.addEventListener("click", () => {
  clickCount++;
  if (clickCount >= 5) {
    window.location.href = "admin-7x92-hidden.html";
  }
  // Reset jika tidak klik dalam 2 detik
  setTimeout(() => { clickCount = 0; }, 2000);
});
</script>

</body>
</html>
