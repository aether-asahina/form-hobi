<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Hobi</title>

<style>
body {
  background: linear-gradient(270deg, #0f172a, #1e1b4b, #312e81);
  background-size: 600% 600%;
  animation: gradientMove 12s ease infinite;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 40px 10px;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top right, rgba(124,58,237,0.25), transparent 40%);
  pointer-events: none;
}

.container {
  max-width: 500px;
  margin: auto;
}

/* progress */
.progress {
  height: 6px;
  background: #334155;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 15px;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #7c3aed, #a78bfa);
  transition: 0.4s;
}

/* card glass */
.card {
  background: rgba(30, 41, 59, 0.75);
  backdrop-filter: blur(10px);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 0 15px rgba(0,0,0,0.4);

  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 0.5s ease forwards;
}

.card:hover {
  transform: translateY(-4px);
  transition: .3s;
}

@keyframes fadeUp {
  to { opacity:1; transform:translateY(0); }
}

label {
  display:block;
  margin-bottom:8px;
}

input[type="text"], textarea, select {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background:#334155;
  color:white;
  margin-top:5px;
}

input:focus, textarea:focus, select:focus {
  outline:none;
  box-shadow:0 0 0 2px #7c3aed;
}

/* chip */
.hobi-list {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.chip input {
  display: none;
}

.chip span {
  display: inline-block;
  padding: 8px 14px;
  border-radius: 20px;
  background: #334155;
  transition: 0.2s;
  cursor: pointer;
}

.chip input:checked + span {
  background: #7c3aed;
  transform: scale(1.05);
}

/* button */
button {
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  color:white;
  cursor:pointer;
  transition:.2s;
  box-shadow: 0 0 12px rgba(124,58,237,0.4);
}

button:hover {
  opacity: 0.9;
}

button:active {
  transform:scale(.97);
}

/* spinner */
.spinner {
  width:30px;
  height:30px;
  border:4px solid #334155;
  border-top:4px solid #7c3aed;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:10px auto;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

.hidden {
  display:none;
}

.status {
  text-align:center;
  margin-top:10px;
  color:#a78bfa;
}

/* header */
.header {
  background: linear-gradient(135deg, #7c3aed, #4f46e5);
  padding: 25px;
  border-radius: 16px;
  margin-bottom: 20px;
}

.header-content {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header-img {
  width: 70px;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0px); }
}

/* footer */
.footer {
  margin-top: 30px;
  padding: 15px;
  text-align: center;
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  border-top: 1px solid #1e293b;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="header-content">
    <div>
      <h2><span id="secretRocket">🚀</span> Kenali Potensi Dirimu</h2>
      <p style="font-size:13px;opacity:0.8;">
        Data ini bantu kami bikin event & peluang sesuai minat kalian
      </p>
    </div>
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="header-img">
  </div>
</div>

<div class="progress">
  <div class="progress-bar" id="progressBar"></div>
</div>

<form id="formHobi">

<div class="card">
<label>Nama</label>
<input id="nama" type="text" required>
</div>

<div class="card">
<label>Semester</label>
<label><input type="radio" name="semester" value="2"> 2</label>
<label><input type="radio" name="semester" value="4"> 4</label>
<label><input type="radio" name="semester" value="6"> 6</label>
<label><input type="radio" name="semester" value="8"> 8</label>
</div>

<div class="card">
<label>Hobi</label>

<div class="hobi-list">
<label class="chip"><input type="checkbox" name="hobi" value="Gaming"><span>Gaming</span></label>
<label class="chip"><input type="checkbox" name="hobi" value="Olahraga"><span>Olahraga</span></label>
<label class="chip"><input type="checkbox" name="hobi" value="Ngoding"><span>Ngoding</span></label>
<label class="chip"><input type="checkbox" name="hobi" value="Musik"><span>Musik</span></label>
<label class="chip"><input type="checkbox" name="hobi" value="Trading"><span>Trading</span></label>
</div>

<label class="chip">
<input type="checkbox" id="lainnyaCheck">
<span>Lainnya</span>
</label>

<input id="lainnyaInput" type="text" placeholder="Isi hobi lain..." class="hidden">
</div>

<div class="card">
<label>Minat</label>
<select id="minat" required>
<option value="">Pilih</option>
<option>Cuma hobi</option>
<option>Mau dikembangkan</option>
<option>Jadi penghasilan</option>
</select>
</div>

<div class="card">
<label>Tujuan</label>
<textarea id="tujuan"></textarea>
</div>

<div class="card">
<button id="submitBtn">Kirim</button>

<div id="loading" class="hidden">
<div class="spinner"></div>
<p>Ngirim...</p>
</div>

<p id="status" class="status"></p>
</div>

</form>

</div>

<footer class="footer">
© 2026 Form Hobi • Ketua 🚀
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIza...",
  authDomain: "hobi-c4dca.firebaseapp.com",
  projectId: "hobi-c4dca",
});
const db = getFirestore(app);

const form = document.getElementById("formHobi");
const loading = document.getElementById("loading");
const button = document.getElementById("submitBtn");

const lainnyaCheck = document.getElementById("lainnyaCheck");
const lainnyaInput = document.getElementById("lainnyaInput");

lainnyaCheck.onchange = () => {
  lainnyaInput.classList.toggle("hidden", !lainnyaCheck.checked);
};

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  let hobi = [...document.querySelectorAll('input[name="hobi"]:checked')]
    .map(el => el.value);

  if (lainnyaCheck.checked && lainnyaInput.value) {
    hobi.push(lainnyaInput.value);
  }

  loading.classList.remove("hidden");
  button.disabled = true;

  await addDoc(collection(db,"hobi"), {
    nama: nama.value,
    semester: document.querySelector('input[name="semester"]:checked')?.value,
    hobi,
    minat: minat.value,
    tujuan: tujuan.value,
    waktu: new Date()
  });

  setTimeout(()=> location.href="thanks.html",1500);
});
</script>

</body>
</html>
