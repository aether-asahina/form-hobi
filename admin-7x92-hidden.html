<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Analytics Pro</title>

<link rel="icon" type="image/jpeg" href="jokowi.jpg">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* TEMA DEEP SEA ANALYTICS */
body {
  background: #020617; 
  color: #f8fafc;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 0;
  min-height: 100vh;
}

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

/* LOGIN BOX */
.login-container {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card {
  background: #0f172a;
  border: 1px solid #1e293b;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  margin-bottom: 20px;
}

/* STATS AREA */
.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}

.metric-card {
  background: linear-gradient(135deg, #1e293b, #0f172a);
  padding: 20px;
  border-radius: 16px;
  border: 1px solid #334155;
  text-align: center;
}

.metric-card h4 { margin: 0; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
.metric-card p { margin: 10px 0 0; font-size: 28px; font-weight: bold; color: #3b82f6; } /* Ubah ke Biru */

/* FILTERS */
.filter-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

input, select {
  flex: 1;
  min-width: 150px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #1e293b;
  color: white;
  outline: none;
}

input:focus { border-color: #3b82f6; } /* Ubah ke Biru */

/* CHARTS */
.chart-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

@media (max-width: 768px) {
  .chart-grid { grid-template-columns: 1fr; }
}

/* DATA LIST */
.data-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 20px 15px;
  border-bottom: 1px solid #1e293b;
  transition: 0.2s;
}

.data-row:hover { background: rgba(255,255,255,0.02); }

.data-info b { color: #3b82f6; font-size: 18px; display: block; margin-bottom: 4px; } /* Ubah ke Biru */
.data-info span { color: #64748b; font-size: 13px; }

/* BADGES */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  margin-right: 5px;
  margin-top: 5px;
  font-weight: 600;
  border: 1px solid transparent;
}

.badge-standar { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border-color: rgba(59, 130, 246, 0.2); }
.badge-custom { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border-color: rgba(148, 163, 184, 0.2); }

/* BOXES (Tujuan & Ide Event) */
.info-box {
  background: rgba(0,0,0,0.2);
  padding: 10px;
  border-radius: 10px;
  margin-top: 10px;
}

.tujuan-border { border-left: 3px solid #3b82f6; } /* Ubah ke Biru */
.event-border { border-left: 3px solid #f59e0b; background: rgba(245, 158, 11, 0.03); }

.info-box small {
  color: #64748b;
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.info-box p {
  margin: 0;
  font-size: 13px;
  color: #cbd5e1;
  line-height: 1.4;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

.btn-primary { background: #3b82f6; color: white; } /* Ubah ke Biru */
.btn-logout { background: #1e293b; color: #64748b; font-size: 12px; border: 1px solid #334155; }

.delete {
  background: transparent;
  color: #ef4444;
  font-size: 12px;
  border: 1px solid #451a1a;
  padding: 8px 12px;
}

.hidden { display: none !important; }
</style>
</head>

<body>

<div class="container">

  <div id="loginBox" class="login-container">
    <div class="card" style="width: 100%; max-width: 380px; text-align: center;">
      <h2 style="margin-top:0">🔐 Admin Analytics</h2>
      <p style="color:#64748b; font-size:14px; margin-bottom: 25px;">Dashboard Monitoring Azkylyss</p>
      <input id="email" placeholder="Email Admin" style="margin-bottom:15px">
      <input id="password" type="password" placeholder="Password" style="margin-bottom:20px">
      <button class="btn-primary" onclick="login()" style="width:100%">Masuk Dashboard</button>
    </div>
  </div>

  <div id="dashboard" class="hidden">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
      <div>
        <h1 style="margin:0; font-size: 26px;">📊 Hobi Analytics</h1>
        <p style="color:#64748b; margin:5px 0 0;">Data Visualization Pro</p>
      </div>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>

    <div class="metrics">
      <div class="metric-card">
        <h4>Responden</h4>
        <p id="statTotal">0</p>
      </div>
      <div class="metric-card">
        <h4>Teraktif</h4>
        <p id="statSemester">-</p>
      </div>
      <div class="metric-card">
        <h4>Top Hobi</h4>
        <p id="statHobi" style="font-size: 18px;">-</p>
      </div>
    </div>

    <div class="card">
      <div class="filter-row">
        <input id="search" placeholder="Cari nama mahasiswa...">
        <select id="filterSemester">
          <option value="all">Semua Semester</option>
          <option value="2">Semester 2</option>
          <option value="4">Semester 4</option>
          <option value="6">Semester 6</option>
          <option value="8">Semester 8</option>
        </select>
      </div>
    </div>

    <div class="chart-grid">
      <div class="card">
        <h4 style="margin-top:0; color:#64748b; font-size: 12px; text-transform: uppercase;">Trend Hobi</h4>
        <canvas id="chart"></canvas>
      </div>
      <div class="card">
        <h4 style="margin-top:0; color:#64748b; font-size: 12px; text-transform: uppercase;">Persentase Hobi</h4>
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <div class="card" style="padding: 10px 0;">
      <h4 style="padding: 15px 24px; margin:0; color:#94a3b8; font-size: 13px; border-bottom: 1px solid #1e293b;">FEED RESPONDEN</h4>
      <div id="list"></div>
    </div>

  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfw2aw4kZkFgBnzRs4aBpDOomrNnD5JcM",
  authDomain: "hobi-c4dca.firebaseapp.com",
  projectId: "hobi-c4dca",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const HOBI_STANDAR = ["Gaming", "Olahraga", "Ngoding", "Musik", "Trading", "Date with Ayang"];

const COLOR_MAP = {
  "Gaming": "#3b82f6",
  "Ngoding": "#60a5fa",
  "Olahraga": "#8b5cf6",
  "Musik": "#f59e0b",
  "Trading": "#06b6d4",
  "Date with Ayang": "#ef4444",
  "Lainnya": "#64748b"
};

window.addEventListener("load", () => { signOut(auth); });

const list = document.getElementById("list");
const searchInput = document.getElementById("search");
const filterSemester = document.getElementById("filterSemester");

let chart;
let pieChart;
let allData = [];

window.login = async () => {
  try {
    await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
  } catch { alert("Login Gagal."); }
};

window.logout = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (user && user.email === "azkylyss@gmail.com") {
    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");
    loadData();
  } else {
    loginBox.classList.remove("hidden");
    dashboard.classList.add("hidden");
  }
});

function loadData() {
  onSnapshot(collection(db, "hobi"), (snapshot) => {
    allData = [];
    snapshot.forEach(docSnap => { allData.push({ id: docSnap.id, ...docSnap.data() }); });
    applyFilter();
  });
}

function applyFilter() {
  let filtered = allData;
  if (filterSemester.value !== "all") filtered = filtered.filter(d => d.semester === filterSemester.value);
  if (searchInput.value) filtered = filtered.filter(d => d.nama.toLowerCase().includes(searchInput.value.toLowerCase()));
  updateStats(filtered);
  render(filtered);
  renderCharts(filtered);
}

searchInput.addEventListener("input", applyFilter);
filterSemester.addEventListener("change", applyFilter);

function updateStats(data) {
  document.getElementById("statTotal").innerText = data.length;
  const hobiCounts = {};
  data.forEach(d => d.hobi.forEach(h => {
    const label = HOBI_STANDAR.includes(h) ? h : "Lainnya";
    hobiCounts[label] = (hobiCounts[label] || 0) + 1;
  }));
  const topHobi = Object.entries(hobiCounts).sort((a,b) => b[1]-a[1])[0];
  document.getElementById("statHobi").innerText = topHobi ? topHobi[0] : "-";
  const semCounts = {};
  data.forEach(d => semCounts[d.semester] = (semCounts[d.semester] || 0) + 1);
  const topSem = Object.entries(semCounts).sort((a,b) => b[1]-a[1])[0];
  document.getElementById("statSemester").innerText = topSem ? "S" + topSem[0] : "-";
}

function render(data) {
  list.innerHTML = "";
  data.forEach(d => {
    const div = document.createElement("div");
    div.className = "data-row";
    
    const badgeHTML = d.hobi.map(h => {
      const isStandar = HOBI_STANDAR.includes(h);
      const cls = isStandar ? 'badge-standar' : 'badge-custom';
      return `<span class="badge ${cls}">${h}</span>`;
    }).join('');

    div.innerHTML = `
      <div class="data-info" style="flex: 1; padding-right: 20px;">
        <b>${d.nama}</b> 
        <span>Semester ${d.semester} • ${d.minat || "Personal"}</span>
        <div style="margin: 8px 0;">${badgeHTML}</div>
        
        <div class="info-box tujuan-border">
          <small>🎯 Tujuan / Harapan:</small>
          <p>${d.tujuan || "-"}</p>
        </div>

        <div class="info-box event-border">
          <small>💡 Ide Event Kedepannya:</small>
          <p>${d.ideEvent || "Belum ada ide yang dibagikan."}</p>
        </div>
      </div>
      <button class="delete" onclick="hapus('${d.id}')">Hapus</button>
    `;
    list.appendChild(div);
  });
}

window.hapus = async (id) => { if (confirm("Hapus data ini?")) await deleteDoc(doc(db, "hobi", id)); };

function renderCharts(data) {
  const count = {};
  data.forEach(d => {
    d.hobi.forEach(h => {
      const label = HOBI_STANDAR.includes(h) ? h : "Lainnya";
      count[label] = (count[label] || 0) + 1;
    });
  });
  const labels = Object.keys(count);
  const values = Object.values(count);
  const backgroundColors = labels.map(l => COLOR_MAP[l] || COLOR_MAP["Lainnya"]);

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: { labels, datasets: [{ data: values, backgroundColor: backgroundColors, borderRadius: 6 }] },
    options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { stepSize: 1 } } } }
  });

  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById("pieChart"), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: backgroundColors, borderWidth: 0 }] },
    options: { cutout: '70%', plugins: { legend: { position: 'bottom', labels: { color: "#64748b", font: { size: 10 } } } } }
  });
}
</script>
</body>
</html>
