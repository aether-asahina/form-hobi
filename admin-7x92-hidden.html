<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  background:#0f172a;
  color:white;
  font-family:sans-serif;
  margin:0;
  padding:20px;
}

.container {
  max-width:700px;
  margin:auto;
}

.card {
  background:#1e293b;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
}

input, select {
  width:100%;
  padding:10px;
  margin-bottom:10px;
  border-radius:8px;
  border:none;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:6px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}

.delete { background:red; }
.logout {
  background:#64748b;
  float:right;
}

.hidden { display:none; }
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginBox" class="card">
  <h3>🔐 Login Admin</h3>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">

  <div class="card">
    <h2>📊 Dashboard Hobi</h2>
    <button class="logout" onclick="logout()">Logout</button>

    <input id="search" placeholder="Cari nama...">

    <select id="filterSemester">
      <option value="all">Semua Semester</option>
      <option value="2">Semester 2</option>
      <option value="4">Semester 4</option>
      <option value="6">Semester 6</option>
      <option value="8">Semester 8</option>
    </select>
  </div>

  <div class="card">
    <canvas id="chart"></canvas>
  </div>

  <div class="card">
    <canvas id="pieChart"></canvas>
  </div>

  <div id="list"></div>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfw2aw4kZkFgBnzRs4aBpDOomrNnD5JcM",
  authDomain: "hobi-c4dca.firebaseapp.com",
  projectId: "hobi-c4dca",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// paksa logout tiap buka
window.addEventListener("load", () => {
  signOut(auth);
});

const list = document.getElementById("list");
const searchInput = document.getElementById("search");
const filterSemester = document.getElementById("filterSemester");

let chart;
let pieChart;
let allData = [];

// LOGIN
window.login = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value,
      document.getElementById("password").value
    );
  } catch {
    alert("Lu bukan admin 😹");
  }
};

// LOGOUT
window.logout = () => signOut(auth);

// AUTH CHECK
onAuthStateChanged(auth, (user) => {
  if (user) {
    if (user.email !== "azkylyss@gmail.com") {
      alert("Lu bukan admin 😹");
      signOut(auth);
      return;
    }

    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");
    loadData();
  } else {
    loginBox.classList.remove("hidden");
    dashboard.classList.add("hidden");
  }
});

// LOAD DATA
function loadData() {
  onSnapshot(collection(db, "hobi"), (snapshot) => {
    allData = [];
    snapshot.forEach(docSnap => {
      allData.push({ id: docSnap.id, ...docSnap.data() });
    });

    applyFilter();
  });
}

// FILTER
function applyFilter() {
  let filtered = allData;

  if (filterSemester.value !== "all") {
    filtered = filtered.filter(d => d.semester === filterSemester.value);
  }

  if (searchInput.value) {
    filtered = filtered.filter(d =>
      d.nama.toLowerCase().includes(searchInput.value.toLowerCase())
    );
  }

  render(filtered);
  renderChart(filtered);
  renderPieChart(filtered);
}

searchInput.addEventListener("input", applyFilter);
filterSemester.addEventListener("change", applyFilter);

// LIST
function render(data) {
  list.innerHTML = "";

  data.forEach(d => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <b>${d.nama}</b> (S${d.semester})<br>
      Hobi: ${d.hobi.join(", ")}<br>
      Minat: ${d.minat}<br>
      Tujuan: <i>${d.tujuan?.slice(0,100) || "-"}</i>...
      <button class="delete" onclick="hapus('${d.id}')">Hapus</button>
    `;

    list.appendChild(div);
  });
}

// DELETE
window.hapus = async (id) => {
  if (confirm("Hapus data?")) {
    await deleteDoc(doc(db, "hobi", id));
  }
};

// BAR CHART
function renderChart(data) {
  const count = {};

  data.forEach(d => {
    d.hobi.forEach(h => {
      count[h] = (count[h] || 0) + 1;
    });
  });

  const sorted = Object.entries(count).sort((a,b)=>b[1]-a[1]);

  const labels = sorted.map(i=>i[0]);
  const values = sorted.map(i=>i[1]);

  if (chart) chart.destroy();

  chart = new Chart(chartCanvas, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: "#22c55e"
      }]
    }
  });
}

// PIE CHART
function renderPieChart(data) {
  const count = {};

  data.forEach(d => {
    d.hobi.forEach(h => {
      count[h] = (count[h] || 0) + 1;
    });
  });

  const labels = Object.keys(count);
  const values = Object.values(count);

  if (pieChart) pieChart.destroy();

  pieChart = new Chart(pieChartCanvas, {
    type: "pie",
    data: {
      labels,
      datasets: [{
        data: values
      }]
    }
  });
}

const chartCanvas = document.getElementById("chart");
const pieChartCanvas = document.getElementById("pieChart");

</script>

</body>
</html>
