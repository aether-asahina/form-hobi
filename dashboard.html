<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Data</title>
</head>

<body style="background:#0f172a;color:white;font-family:sans-serif">

<h2>📊 Data Hobi Anggota</h2>

<div id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfw2aw4kZkFgBnzRs4aBpDOomrNnD5JcM",
  authDomain: "hobi-c4dca.firebaseapp.com",
  projectId: "hobi-c4dca",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const list = document.getElementById("list");

const querySnapshot = await getDocs(collection(db, "hobi"));

querySnapshot.forEach((doc) => {
  const data = doc.data();

  list.innerHTML += `
    <div style="margin-bottom:10px;padding:10px;background:#1e293b;border-radius:8px">
      <b>${data.nama}</b> (Semester ${data.semester})<br>
      Hobi: ${data.hobi.join(", ")}<br>
      Minat: ${data.minat}<br>
      Tujuan: ${data.tujuan}
    </div>
  `;
});
</script>

</body>
</html>
